<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <clipPath id="circleClip">
      <circle cx="64" cy="64" r="58" />
    </clipPath>
    <radialGradient id="outerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#0B1120" stop-opacity="1" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.3" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="128" height="128" rx="32" fill="#0B1120" />
  <circle cx="64" cy="64" r="60" fill="url(#outerGlow)" stroke="#D4AF37" stroke-width="2.5" />

  <!-- Official Perla Pearl Logo Medallion -->
  <image 
    href="/perla-logo.jpg" 
    x="6" 
    y="6" 
    width="116" 
    height="116" 
    clip-path="url(#circleClip)" 
    preserveAspectRatio="xMidYMid slice" 
  />
</svg>
