    <!-- 7. Right Outer Arm / Back Line -->
    <path d="M 368 78 C 392 126, 414 192, 426 264 C 438 340, 440 418, 436 484 C 434 516, 430 550, 420 584" stroke-width="7"/>

    <!-- 8. Delicate Vertical Navel Accent -->
    <path d="M 104 424 C 114 438, 114 452, 106 466" stroke-width="5.5"/>

    <!-- 9. Groin / Inner Hip Accent Line -->
    <path d="M 224 592 C 222 618, 216 646, 204 674" stroke-width="5.5"/>

    <!-- 10. Left Inner Leg Contour -->
    <path d="M 98 572 C 94 626, 88 704, 80 792 C 76 830, 72 864, 70 880" stroke-width="6"/>
  </g>
</svg>