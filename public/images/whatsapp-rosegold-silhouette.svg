<svg viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="ribbon-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="12" stdDeviation="9" floodColor="#8B4D3B" floodOpacity="0.22" />
    </filter>
    <filter id="star-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="roseGoldBody" x1="200" y1="100" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C98A6F" />
      <stop offset="18%" stop-color="#F5DFD2" />
      <stop offset="35%" stop-color="#BA7558" />
      <stop offset="52%" stop-color="#ECC2AB" />
      <stop offset="70%" stop-color="#8F4832" />
      <stop offset="85%" stop-color="#E5B79E" />
      <stop offset="100%" stop-color="#B36A4E" />
    </linearGradient>
    <linearGradient id="roseGoldSweep" x1="500" y1="50" x2="800" y2="950" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B87355" />
      <stop offset="15%" stop-color="#FCECE3" />
      <stop offset="35%" stop-color="#AB6346" />
      <stop offset="55%" stop-color="#F2D1BF" />
      <stop offset="75%" stop-color="#7D3B25" />
      <stop offset="90%" stop-color="#DFAD94" />
      <stop offset="100%" stop-color="#A85C3F" />
    </linearGradient>
    <linearGradient id="tubeHighlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FFF2EB" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9" />
    </linearGradient>
    <radialGradient id="sparkleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FFF3ED" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#E8B89E" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#C98A6F" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Shadows -->
  <g filter="url(#ribbon-shadow)">
    <path d="M 495 58 C 530 112 602 165 644 212 C 668 248 662 360 638 460 C 618 535 645 640 695 735 C 738 815 774 888 778 930" stroke="#7A3D29" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5" />
    <path d="M 538 260 C 490 320 430 405 375 405 C 335 405 305 370 295 315" stroke="#7A3D29" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5" />
    <path d="M 275 335 C 258 380 255 425 268 472 C 285 532 328 578 336 626 C 350 695 334 772 295 852 C 282 880 286 910 305 935" stroke="#7A3D29" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5" />
    <path d="M 575 365 C 545 425 515 482 508 538 C 500 600 522 668 568 728 C 625 805 658 875 605 955" stroke="#7A3D29" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5" />
    <path d="M 575 430 C 612 542 668 678 728 805 C 748 848 752 888 745 912" stroke="#7A3D29" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.45" />
    <path d="M 480 720 C 455 770 415 848 375 940" stroke="#7A3D29" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.45" />
  </g>

  <!-- Primary Metallic Tubes -->
  <path d="M 495 58 C 530 112 602 165 644 212 C 668 248 662 360 638 460 C 618 535 645 640 695 735 C 738 815 774 888 778 930" stroke="url(#roseGoldSweep)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M 538 260 C 490 320 430 405 375 405 C 335 405 305 370 295 315" stroke="url(#roseGoldBody)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M 275 335 C 258 380 255 425 268 472 C 285 532 328 578 336 626 C 350 695 334 772 295 852 C 282 880 286 910 305 935" stroke="url(#roseGoldBody)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M 575 365 C 545 425 515 482 508 538 C 500 600 522 668 568 728 C 625 805 658 875 605 955" stroke="url(#roseGoldSweep)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M 575 430 C 612 542 668 678 728 805 C 748 848 752 888 745 912" stroke="url(#roseGoldSweep)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M 480 720 C 455 770 415 848 375 940" stroke="url(#roseGoldBody)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- 3D Ridge Highlights -->
  <path d="M 497 60 C 531 113 603 166 643 211 C 666 247 660 358 636 458 C 616 533 643 638 693 733 C 736 813 772 886 776 928" stroke="url(#tubeHighlight)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85" />
  <path d="M 536 261 C 489 321 430 403 375 403 C 336 403 306 369 296 316" stroke="url(#tubeHighlight)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85" />
  <path d="M 276 337 C 260 381 257 426 270 473 C 287 533 330 579 338 627 C 352 696 336 773 297 853" stroke="url(#tubeHighlight)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85" />
  <path d="M 573 367 C 544 426 514 483 507 539 C 499 601 521 669 567 729 C 623 806 656 876 604 954" stroke="url(#tubeHighlight)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85" />

  <!-- Sparkles -->
  <g filter="url(#star-glow)">
    <g transform="translate(644, 212)">
      <circle cx="0" cy="0" r="14" fill="url(#sparkleGlow)" />
      <path d="M 0 -18 Q 0 0 -18 0 Q 0 0 0 18 Q 0 0 18 0 Q 0 0 0 -18 Z" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="3.5" fill="#FFF8F5" />
    </g>
    <g transform="translate(330, 565)">
      <circle cx="0" cy="0" r="15" fill="url(#sparkleGlow)" />
      <path d="M 0 -19 Q 0 0 -19 0 Q 0 0 0 19 Q 0 0 19 0 Q 0 0 0 -19 Z" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="4" fill="#FFF8F5" />
    </g>
    <g transform="translate(650, 715)">
      <circle cx="0" cy="0" r="16" fill="url(#sparkleGlow)" />
      <path d="M 0 -20 Q 0 0 -20 0 Q 0 0 0 20 Q 0 0 20 0 Q 0 0 0 -20 Z" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="4.5" fill="#FFF8F5" />
    </g>
  </g>
</svg>
